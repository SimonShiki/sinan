# sinan configuration. Install as /etc/sinan/config.yaml.

# Wi-Fi networks treated as untrusted (A). Every other Wi-Fi is trusted (C)
# and left alone, as are tethering-only, Ethernet, Bluetooth, ... setups.
untrusted_ssids:
  - Example-Untrusted-WiFi

# How phone tethering (B) is recognized: kernel driver of the interface,
# and/or interface name patterns.
tether:
  drivers: [rndis_host, cdc_ncm, cdc_ether, ipheth]
  # interfaces: ["usb*"]

# Endpoints that must never be reached through A (IPs, CIDRs, domains).
proxy: []

# Clash/mihomo YAML files (globs); every proxies[].server is a proxy endpoint.
# FlClash keeps its fully expanded runtime config here (replace <user>):
proxy_sources:
  - /home/<user>/.local/share/com.follow.clash/config.yaml

# Whitelist: always allowed on A, even if listed above (IPs, CIDRs, domains).
direct: []

# DNS servers for domain rules, queried directly through the uplink so that a
# TUN-mode proxy cannot hijack them. Use what your proxy client uses for
# proxy-server-nameserver. Empty: system resolver.
dns: [223.5.5.5, 119.29.29.29]

# refresh: 10m        # re-resolve domains (source files are watched every 15s)
# retain: 24h         # keep previously resolved endpoint addresses this long
# metric: 10          # metric of the default route via A
# table: 7101         # policy table for fast-fail block routes
# rule_priority: 8999 # must be lower than the proxy client's rules (FlClash: 9000)
